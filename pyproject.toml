[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-engine"
version = "0.1.0"
description = "Market sentiment and signal research system (paper trading only — no live execution)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Alpaca — market data + paper trading
    "alpaca-py>=0.30.0",
    # News APIs
    "finnhub-python>=2.4.20",
    "newsapi-python>=0.2.7",
    # Core data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    # Technical indicators
    "pandas-ta>=0.3.14b0",
    # Sentiment
    "vaderSentiment>=3.3.2",
    # Backtesting
    "vectorbt>=0.26.0",
    # Options data (LEAPS stub)
    "polygon-api-client>=1.14.0",
    # Infrastructure
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "plotly>=5.18.0",
    # Web Dashboard
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
signal-engine = "signal_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
