# Beaten-down quality stock dip strategy (LEAPS idea from a trading video)
# Backtested on the stocks themselves:  uv run signal-engine leaps-dip-backtest
# Paper research only. Nothing here places orders.

backtest:
  start: "2016-01-01"        # Alpaca SIP daily history starts in 2016
  holds_months: [6, 12, 24]
  max_positions: 5           # the video spreads across 3 to 5 at once
  initial_capital: 10000
  revenue_filter: true       # needs FINNHUB_API_KEY; skipped with a note if missing
  target_cagr_pct: 25        # Ty's yearly target

rules:
  drawdown_min: 0.50         # close at least 50% below the highest high so far
  high_lookback_bars: null   # null = all history loaded (since 2016, not a true all-time high)
  min_history_bars: 252
  rsi_period: 14
  rsi_max: 30
  rsi_lookback: 3            # RSI under 30 on the pin bar or the 2 bars before
  pin_wick_to_body: 2.0
  pin_wick_to_range: 0.5
  pin_body_top: 0.6
  divergence_rsi_max: 45
  divergence_min_bars: 5
  max_adds: 1

trade:
  entry_fraction: 0.6667     # buy 2/3 of the slot on entry, keep 1/3 for the divergence add
  stock_profit_take: 0.50    # sell the shares at +50%
  call_profit_take: 1.00     # the video takes 70 to 100%+ on the option itself
  stop_loss: null            # the video uses none (a LEAP's premium is the max loss)
  fees_pct: 0.1

# Fixes tested side by side with --compare-variants (shares only).
# Round numbers picked up front, not tuned on the results.
variants:
  hold_months: 12
  split_date: "2022-01-01"   # early and late periods are each replayed fresh
  stop_loss: 0.25            # sell a trade 25% below what was paid
  time_stop_months: 3        # at 3 months, sell a trade still under water
  trend_sma_bars: 200        # only start trades while SPY is above this average
  risk_pct: 0.02             # "small" sizing, 2% of the account at risk at the stop
  small_max_positions: 10

# Rough Black-Scholes estimate for the call version. Not real option quotes.
option:
  min_years: 1.0
  extra_years: 0.25
  strike_pct: 1.0            # at the money
  vol_window: 60
  vol_floor: 0.25
  vol_multiplier: 1.0
  risk_free: 0.045
  cost_pct: 3.0              # spread lost on each side

