# signal-engine Watchlist
# Edit this file to add/remove/customize tickers.
# Fields:
#   symbol:   Ticker symbol (must be valid for Alpaca market data)
#   name:     Human-readable company name
#   sector:   Sector for keyword-based relevance matching
#   themes:   List of macro themes (used for LEAPS screening + political matching)
#   public:   true = publicly traded (price data fetched)
#             false = private company, news monitoring only
#   note:     Optional clarification

tickers:

  # ─────────────────────────────────────────────────
  # INDEX ETFs / FUNDS
  # ─────────────────────────────────────────────────
  - symbol: SPY
    name: "SPDR S&P 500 ETF Trust"
    sector: etf
    themes: [large_cap, index, benchmark]
    public: true

  - symbol: SPYI
    name: "NEOS S&P 500 High Income ETF"
