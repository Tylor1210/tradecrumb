# Weekend Swing Signals Configuration
# Weekly strategy lane: weekend scan -> Monday trigger -> stop -> Friday-close-or-stopped-out exit.
# Independent of the daily composite scan/paper-live loop — see README notes in
# src/signal_engine/weekend_swing/ for how this plugs (or deliberately doesn't) into those.

# ─────────────────────────────────────────────────────────────
# UNIVERSE
# ─────────────────────────────────────────────────────────────
universe:
  top_n: 100              # most-active tickers pulled from Alpaca's screener
  by: volume              # "volume" or "trades" — see alpaca.data.requests.MostActivesBy
  # Always included regardless of screener ranking.
  core_tickers: [SPY, QQQ, NVDA, MSFT, GOOG]
  # Cheap (daily-bar-only) filter applied to the full universe before any
  # intraday data is pulled. Tickers whose price isn't within this % of a
  # relevant pivot level are skipped for the expensive 5/15-min pass.
  pivot_proximity_pct: 2.0
  # Data-sanity guard: reject a ticker if its trailing daily bars contain any
  # single-day move bigger than this (%) — catches unadjusted-split/corrupted
  # data from the volume screener (e.g. LBGJ, whose price series swung from
  # $92 to an average near $12,800 elsewhere in the same 12 months, and whose
  # one backtested trade alone returned -194%). Applied by every strategy's
  # scan(), not just Strategy 1.
  max_single_day_move_pct: 50.0

# ─────────────────────────────────────────────────────────────
# STRATEGY 1 — Prior-Week Breakout Continuation
# ─────────────────────────────────────────────────────────────
# volume_filter_multiplier was a floor-only filter (>1.2x); backtesting found
# that's backwards above ~3x — huge volume spikes on the trigger candle
# correlate with WORSE outcomes (exhaustion prints, not continuation), while
# the >1.2x floor also let too many weak-volume trades through. A 1.5x-3.0x
# band was the only tested variant with positive expected value per trade
# (+0.31% vs -2.27% baseline) — see the backtest diagnostics.
strategy_1_breakout:
  volume_filter_multiplier: 1.5      # floor: trigger candle volume must exceed this x 20-day avg (same time-of-day slot)
  volume_filter_max_multiplier: 3.0  # ceiling: above this, treat as an exhaustion spike and skip
  atr_period: 14
  atr_stop_multiplier: 0.3        # stop = pivot -/+ 0.3 * ATR14 (whichever is tighter than the breakout candle's low/high)
  # NOTE: widening this reduces whipsaw stop-outs and raises win rate, but
  # testing (0.3 -> 0.6 -> 1.0) showed EV/trade gets flat-to-worse each step
  # (losers just lose more) — don't treat win rate alone as progress here.
  exclude_earnings_week: true

# ─────────────────────────────────────────────────────────────
# STRATEGY 2 — Overnight Range Breakout
# ─────────────────────────────────────────────────────────────
# CAVEAT: Alpaca's free IEX feed does not reliably carry true Sunday-night /
# extended-hours prints (no SIP-equivalent 24hr session). "Overnight range" is
# therefore approximated as Friday's regular-session close through Monday's
# regular-session open — NOT a true overnight/globex-style session. Every
# signal this strategy produces is tagged with this caveat in its breakdown.
strategy_2_overnight:
  atr_range_multiplier: 1.5       # skip ticker if overnight range > this x (ATR14 / 24)
  atr_period: 14
  trigger_window_minutes: 30      # only trigger within the first N minutes of Monday's regular session

# ─────────────────────────────────────────────────────────────
# STRATEGY 3 — Gap Strength / Gap Fade
# ─────────────────────────────────────────────────────────────
strategy_3_gap:
  restricted_tickers: [SPY, QQQ]  # v1 scope — enforced in code, not just here
  atr_period: 14

# ─────────────────────────────────────────────────────────────
# BACKTEST DEFAULTS
# ─────────────────────────────────────────────────────────────
backtest:
  initial_universe_size: 20       # core 5 + 15 more from the screener, for the first validation pass
  lookback_months: 12
  initial_capital: 100000.0
  position_size_pct: 5.0          # % of portfolio per trade, matches config/backtest.yaml convention
