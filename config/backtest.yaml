# Backtest Configuration
# All parameters here can be adjusted to test different strategies.

# ─────────────────────────────────────────────────
# DATE RANGE (5 years of daily bars from Alpaca)
# ─────────────────────────────────────────────────
start_date: "2020-01-01"
end_date: "2025-01-01"

# ─────────────────────────────────────────────────
# HOLD PERIOD
# How long to hold a position after signal fires.
# Options: 1 (intraday), 5 (swing/week), 21 (monthly)
# Set this in single runs; grid_search below sweeps all.
# ─────────────────────────────────────────────────
hold_period_days: 5

# ─────────────────────────────────────────────────
# RISK MANAGEMENT
# ─────────────────────────────────────────────────
stop_loss_pct: 5.0       # exit if loss exceeds this %
take_profit_pct: 10.0    # exit if gain exceeds this %

# Per-trade loss cap ("10% review / 20% get out"). See src/signal_engine/risk/loss_cap.py.
#  - under 10% down: normal exits only
#  - 10%+ down: stay in only while the setup still shows a chance of gain
#    (the entry's technical score is >= setup_score_floor on that bar),
#    close on the first bar it doesn't
#  - 20%+ down: start closing — exit on the first weak bar, or after
#    exit_within_bars more bars at the latest
#  - backstop_loss_pct: close immediately, no exceptions
# replaces_fixed_stop: true turns off stop_loss_pct above, since a 5% flat
# stop would always fire before 10% and the rule would never run.
# Checks happen on daily closes, so a gap can overshoot a threshold.
# Compare against the old exits with: uv run signal-engine backtest --compare-exits
loss_cap:
  enabled: true
  review_loss_pct: 10.0
  exit_loss_pct: 20.0
  exit_within_bars: 2
  backstop_loss_pct: 25.0
  replaces_fixed_stop: true
  setup_score_floor: 0.0

# Market trend filter. When on, no new longs open on days the index closes
# below its sma_days simple average (open trades keep their normal exits).
# Optional: also require the ticker itself above its own sma_days average.
# Off by default until the comparison earns it a place:
#   uv run signal-engine backtest --compare-trend-filter
trend_filter:
  enabled: false
  index_symbol: SPY
  sma_days: 200
  require_ticker_above_sma: false

# ─────────────────────────────────────────────────
# PORTFOLIO SETTINGS
# ─────────────────────────────────────────────────
# Account sizing for Return, Max DD, CAGR and the weekly/monthly stats.
# All tickers share one cash balance. Each new trade gets position_size_pct of
# current account equity (cash + open positions at that day's close), never
# more than free cash. Once max_positions trades are open, new signals are
# skipped until one closes. 10% x 10 positions = fully invested at most, no
# leverage. Win rate / avg loss / worst trade still count every signal.
initial_capital: 100000.0  # paper portfolio starting value ($)
position_size_pct: 10.0    # % of current account equity per new trade
max_positions: 10          # most trades open at once

# ─────────────────────────────────────────────────
# WIN RATE TARGET
# Signals below this bar should NOT proceed to paper trading.
# Win rate = profitable trades / total trades.
# Even +0.01% profit counts as a win.
# ─────────────────────────────────────────────────
accuracy_target_pct: 70.0

# ─────────────────────────────────────────────────
# GRID SEARCH CONFIG
# Run with: uv run signal-engine backtest --grid-search
# Sweeps all combinations of the ranges below.
# Results saved to reports/grid_search_results.csv
# ─────────────────────────────────────────────────
grid_search:
  # Signal weight ranges (will be normalized to sum=1)
  weight_technical_range: [0.20, 0.30, 0.40, 0.50, 0.60]
  weight_sentiment_range: [0.10, 0.20, 0.30, 0.40]
  weight_political_range: [0.10, 0.20, 0.30]

  # Hold period options (days)
  hold_period_range: [1, 5, 10, 21]

  # Buy threshold sweep
  buy_threshold_range: [0.40, 0.45, 0.50, 0.55, 0.60, 0.65]

# ─────────────────────────────────────────────────
# OUTPUT
# ─────────────────────────────────────────────────
output_dir: "reports"
save_equity_curve: true        # saves HTML equity curve per run
grid_search_csv: "reports/grid_search_results.csv"
